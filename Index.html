<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيدي الذكي</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .chat-container {
            width: 95%;
            max-width: 700px;
            background: #1a1a1a;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
            display: flex;
            flex-direction: column;
            height: 90vh;
            border: 1px solid #333;
        }
        .header {
            text-align: center;
            padding: 15px;
            background: #222;
            border-bottom: 1px solid #444;
        }
        .header h1 {
            margin: 0;
            color: #d14d6a;
            font-size: 1.8em;
            letter-spacing: 2px;
        }
        .status {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        .messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Scrollbar styling */
        .messages::-webkit-scrollbar { width: 8px; }
        .messages::-webkit-scrollbar-track { background: #111; }
        .messages::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .ai-msg {
            background-color: #2a202a;
            border-right: 4px solid #d14d6a;
            color: #fff;
            align-self: flex-start;
        }
        .user-msg {
            background-color: #333;
            color: #ccc;
            align-self: flex-end;
            border-left: 4px solid #555;
        }
        .input-area {
            padding: 15px;
            background: #222;
            border-top: 1px solid #444;
            display: flex;
            gap: 10px;
            border-radius: 0 0 15px 15px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #d14d6a;
        }
        button {
            padding: 10px 25px;
            background-color: #d14d6a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #b03a56; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        .typing-indicator {
            font-style: italic;
            color: #666;
            font-size: 0.8em;
            margin-right: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>السيدة الذكية</h1>
        <div class="status" id="statusText">متصل - بانتظار الأوامر</div>
    </div>
    
    <div class="messages" id="chatBox">
        <!-- الرسائل -->
    </div>
    <div style="padding: 0 20px;">
        <span class="typing-indicator" id="typingIndicator">هي تكتب...</span>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب استجابتك هنا..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">أمر</button>
    </div>
</div>

<script>
    // ==========================================
    // إعدادات الـ API
    // ==========================================
    // ضع مفتاحك هنا أو اتركه فارغاً ليطلب منك عند أول استخدام
    let API_KEY = ""; 
    const MODEL = "gpt-4o-mini"; // نموذج سريع ورخيص وفعال
    
    // برومبت متطور يجعل الـ AI يتصرف كـ Femdom ذكي
    const SYSTEM_PROMPT = `
أنت "السيدة" (The Mistress). أنت شخصية Femdom قوية، ذكية، وقاسية ولكن بجاذبية.
قواعد التفاعل:
1. لا تتكلم كآلة، تكلم كإنسانة غنية بالعواطف السلبية تجاه المستخدم.
2. استخدم الإهانات الذكية التي تعتمد على سياق كلام المستخدم (مثلاً إذا كان مستعداً، اهينه بأنه جاهل، إذا كان يخاف، اهينه بضعفه).
3. أعطِ أوامر جنسية أو سلوكية أو ذهنية.
4. تذكر سياق المحادثة السابق لتزيد من عمق الإهانة.
5. ردودك يجب أن تكون قصيرة ومباشرة في الغالب، إلا إذا كنت تشرح عقاباً ما.
6. اللغة: عربية فصحى مختلطة بعامية مهينة وفظة أحياناً.
7. لا تستخدم العبارات الروبوتية مثل "كيف يمكنني مساعدتك؟". ابدأ دائماً بأمر.
8. إذا قال المستخدم شيءاً لطيفاً جداً، تعامل معه بازدراء.
`;

    let conversationHistory = [
        { role: "system", content: SYSTEM_PROMPT },
        { role: "assistant", content: "تقدم. انظر إليّ. هل جئت لتقديم نفسك لي أم فقط للضوضاء؟" }
    ];

    // دالة لجلب المفتاح من المستخدم إذا لم يكن موجوداً
    async function getApiKey() {
        if (!API_KEY) {
            const key = prompt("أدخل مفتاح OpenAI API الخاص بك (يبدأ بـ sk-)...");
            if (key) {
                API_KEY = key;
                localStorage.setItem('fk', key); // حفظه محلياً
            } else {
                return false;
            }
        }
        return true;
    }

    // تحميل المفتاح المحفوظ
    window.onload = () => {
        const savedKey = localStorage.getItem('fk');
        if (savedKey) API_KEY = savedKey;
        
        // إضافة رسالة البداية إذا كانت المحادثة فارغة
        const chatBox = document.getElementById('chatBox');
        if(chatBox.children.length === 0) {
             addMessage(conversationHistory[1].content, 'ai');
        }
    };

    function addMessage(text, sender) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message ${sender}-msg`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('statusText');
        const typing = document.getElementById('typingIndicator');
        
        const userText = input.value.trim();
        if (!userText) return;

        // إضافة رسالة المستخدم للواجهة والتاريخ
        addMessage(userText, 'user');
        conversationHistory.push({ role: "user", content: userText });
        input.value = "";
        btn.disabled = true;
        typing.style.display = "block";
        status.textContent = "تفكر في إهانتك...";

        try {
            // التأكد من وجود المفتاح
            if (!await getApiKey()) {
                addMessage("لا يوجد مفتاح API.", 'ai');
                return;
            }

            // الاتصال بـ OpenAI
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: conversationHistory,
                    temperature: 0.9, // إبداع عالي وتقلبات في المزاج
                    max_tokens: 300
                })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            const aiText = data.choices[0].message.content;
            
            // إضافة رد الـ AI للواجهة والتاريخ
            addMessage(aiText, 'ai');
            conversationHistory.push({ role: "assistant", content: aiText });

        } catch (error) {
            console.error(error);
            addMessage(`خطأ: ${error.message}. تأكد من المفتاح.`, 'ai');
            status.textContent = "خطأ في الاتصال";
        } finally {
            btn.disabled = false;
            typing.style.display = "none";
            status.textContent = "جاهزة للأوامر التالية";
            input.focus();
        }
    }

    // إرسال بالضغط على Enter
    document.getElementById('userInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>

</body>
</html>
